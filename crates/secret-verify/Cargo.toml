[package]
name = "gossan-secret-verify"
# Shared glue between `secfinding::Finding` and the
# `gossan-keyhog-lite` verification engine: the process-local
# raw-credential store + the Finding<->RawMatch<->VerifiedFinding
# orchestration. Lives in ONE crate so `gossan-js` and `gossan-scm`
# (and any future secret-emitting scanner) verify identically instead
# of duplicating a security-sensitive raw-secret path. Published
# because `gossan-scm` depends on it and crates.io forbids publishing
# a crate with an unpublished dependency.
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/santhreal/gossan"
description = "Shared secret-verification orchestration (raw-credential store + Finding<->keyhog re-stamp) for gossan's js/scm scanners."

[package.metadata.santh]
status = "internal-glue"

[dependencies]
secfinding = { workspace = true }
gossan-keyhog-lite = { version = "0.3", path = "../keyhog-lite" }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
wiremock = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
proptest = "1.2"

[lints]
workspace = true
