[package]
name = "gossan-core"
# Pinned (not `version.workspace`) so path consumers (karyx) don't inherit 0.1.0.
version = "0.3.3"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage = "https://santh.dev"
repository = "https://github.com/santhreal/gossan"
description = "Core types, traits, and shared networking utilities for the gossan attack-surface scanner, part of the security research ecosystem"
readme = "../../README.md"
keywords = [ "security", "recon", "attack-surface", "scanner" ]
categories = ["command-line-utilities", "network-programming"]


[package.metadata.santh]
status = "alpha"
[dependencies]
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
tracing     = { workspace = true }
url         = { workspace = true, features = ["serde"] }
uuid        = { workspace = true }
# crates.io pins so the GitHub/standalone workspace builds without the
# Santh monorepo checkout. Local monorepo work can still [patch.crates-io].
hashkit     = { workspace = true }
chrono      = { workspace = true }
tokio       = { workspace = true }
scanclient = { workspace = true }
guise-pacing = { workspace = true }
futures      = { workspace = true }
governor    = { workspace = true }
nonzero_ext = { workspace = true }
secfinding = { workspace = true }
toml = "0.8"
base64 = { workspace = true }
proxywire = { workspace = true }
# Karyx/reqwest unify on 0.25 via `hickory-dns`; 0.24's `TokioAsyncResolver::tokio` is gone (W6-F012).
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio", "system-config"] }
idna        = "1"
psl         = "2"

[dev-dependencies]
proptest = {workspace = true}
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = {workspace = true}
ipnet = "2.9"

[lints]
workspace = true
